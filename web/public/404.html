<!doctype html><meta charset="utf-8"><title>Aoide</title>
<script>
// GitHub Pages SPA fallback: stash the deep link and bounce to the app root.
sessionStorage.setItem('aoide:redirect', location.pathname + location.search + location.hash);
location.replace(location.pathname.split('/').slice(0, 2).join('/') + '/');
</script>

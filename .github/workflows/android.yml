name: Android APK

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'web/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        env:
          KS_B64: ${{ secrets.AOIDE_KEYSTORE_B64 }}
        run: printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/aoide-release.jks"

      - name: Build release APK
        env:
          AOIDE_STORE_PASSWORD: ${{ secrets.AOIDE_STORE_PASSWORD }}
        run: >
          ./gradlew assembleRelease --no-daemon --stacktrace
          "-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
          "-PaoideKeystore=$RUNNER_TEMP/aoide-release.jks"
          "-PaoideStorePassword=$AOIDE_STORE_PASSWORD"
          "-PaoideKeyPassword=$AOIDE_STORE_PASSWORD"

      - name: Read version
        id: v
        run: echo "name=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          cp "$APK" "Aoide-${{ steps.v.outputs.name }}.apk"
          cp "$APK" Aoide.apk
          gh release delete "v${{ steps.v.outputs.name }}" -y --cleanup-tag 2>/dev/null || true
          gh release create "v${{ steps.v.outputs.name }}" "Aoide-${{ steps.v.outputs.name }}.apk" Aoide.apk \
            --title "Aoide ${{ steps.v.outputs.name }}" \
            --notes "$(git log -1 --pretty=%B)"$'\n\n'"Android APK, signed with the Aoide release key so it installs over previous builds and updates in place from Settings. Android 8.0 or newer."
